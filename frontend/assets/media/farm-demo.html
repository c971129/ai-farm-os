    $('#sidebar').innerHTML=`<div class="brand"><div class="brand-mark">${logo()}</div><div class="brand-copy"><strong>${escapeHTML(state.settings.farmName)}</strong><small>FARM MANAGEMENT</small></div><button class="collapse-button" data-action="toggle-sidebar" title="收起 / 展开侧栏" aria-label="收起或展开侧栏">${icon('menu','sm')}</button></div><nav class="sidebar-nav">${NAV.map(([route,name,label])=>`<button class="side-item ${state.route===route?'active':''}" data-route="${route}" title="${label}" ${state.route===route?'aria-current="page"':''}>${icon(name)}<span class="sidebar-label">${label}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-quote">科技赋能农业<br>让土地更有价值</div><div class="sidebar-art" aria-hidden="true"></div><div class="sidebar-brandline"><div class="mini-logo">${icon('leaf')}</div><div><strong>${escapeHTML(state.settings.farmName)}</strong><small>© 2026 Farm OS</small></div></div></div>`;
  }
  function renderTopbar(){
    $('#topbar').innerHTML=`<button class="icon-button mobile-menu" data-action="mobile-menu" aria-label="打开导航">${icon('menu')}</button><nav class="topnav" aria-label="主导航">${TOPNAV.map(([route,label],index)=>`<button class="topnav-item ${state.route===route&&index!==0?'active':''}" data-route="${route}" ${state.route===route&&index!==0?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div class="topbar-tools"><button class="top-weather" data-route="conditions" title="查看场景气象数据"><span>${weatherIcon('sun')}</span><span><strong class="num">24.5°C</strong><small>晴 · 西北风 2.1m/s</small></span></button><button class="icon-button notification-button" data-action="notifications" aria-label="查看通知${state.notificationsRead?'':`，${getNotifications().length}条未读`}">${icon('bell')}${state.notificationsRead?'':`<span class="notification-badge">${getNotifications().length}</span>`}</button><button class="profile-button" data-action="profile" aria-label="账户与场景设置"><span class="avatar">${icon('user')}</span><span class="profile-copy"><strong>${escapeHTML(state.settings.manager)}</strong><small>农户 / 场长</small></span>${icon('down','sm')}</button></div>`;
  }

  function filteredTasks(){
    return state.tasks.filter(t=>(state.taskTab==='all'||TASK_STATUSES[t.status].group===state.taskTab)&&(!state.taskSearch||`${t.field} ${parcelById(t.field)?.crop} ${t.type} ${t.manager} ${t.resources.join(' ')}`.toLowerCase().includes(state.taskSearch.toLowerCase())));
  }
  function renderTaskTabs(){const c=taskCounts();return `<div class="task-tabs" role="group" aria-label="农事任务筛选">${[['pending','待核验',c.pending],['running','流程回放',c.running],['done','场景归档',c.done],['all','全部场景',c.total]].map(([key,label,count])=>`<button class="task-tab ${state.taskTab===key?'active':''}" data-action="task-tab" data-tab="${key}" aria-pressed="${state.taskTab===key}">${label}<em>${count}</em></button>`).join('')}</div>`;}
  function taskRows(tasks){return tasks.map(t=>{const f=parcelById(t.field);const typeColor=t.type==='脱叶'?'red':['巡田','灌溉'].includes(t.type)?'green':'orange';const action={draft:['登记场景队列','release'],ready:['开始流程回放','start'],running:['完成流程回放','complete'],done:['查看场景记录','view-task']}[t.status];return `<tr class="${state.selectedTasks.has(t.id)?'row-selected':''}" data-task-row="${escapeHTML(t.id)}"><td><input type="checkbox" data-task-check="${escapeHTML(t.id)}" aria-label="选择 ${f.id} ${escapeHTML(t.type)}任务" ${state.selectedTasks.has(t.id)?'checked':''}></td><td><button class="task-field" data-action="field-detail" data-field="${f.id}"><strong>${f.id}</strong><small>${f.name}</small></button></td><td>${f.crop}<small>${fmt(t.area)}亩</small></td><td><span class="tag task-type-tag ${typeColor}">${escapeHTML(t.type)}</span></td><td><span style="color:#50636d;font-weight:500">${relativeDate(t.date)}</span><small>${t.start}–${t.end}</small></td><td>${statusTag(t.status)}</td><td>${priorityTag(t.priority)}</td><td class="resource-col"><div class="resource-lines" title="${escapeHTML(t.resources.join('、'))}">${t.resources.length?t.resources.map(escapeHTML).join('<br>'):'— —'}</div></td><td class="risk-col"><div class="risk-text" title="${escapeHTML(t.risk)}">${escapeHTML(t.risk)}</div></td><td><div class="table-actions"><button class="button primary small-button" data-action="${action[1]}" data-id="${escapeHTML(t.id)}">${action[0]}</button><button class="row-more" data-action="task-more" data-id="${escapeHTML(t.id)}" aria-label="${f.id} 任务更多操作">${icon('more')}</button></div></td></tr>`;}).join('');}
  function taskTable(){const tasks=filteredTasks();return tasks.length?`<div class="table-wrap"><table class="task-table"><thead><tr><th><input id="select-all-tasks" type="checkbox" aria-label="选择当前筛选的全部任务" ${tasks.every(t=>state.selectedTasks.has(t.id))?'checked':''}></th><th>地块</th><th>作物/面积</th><th>农事任务</th><th>计划时间</th><th>场景状态</th><th>优先级</th><th class="resource-col">资源</th><th class="risk-col">风险/建议</th><th>操作</th></tr></thead><tbody>${taskRows(tasks)}</tbody></table></div>`:emptyState('当前没有匹配的农事',state.taskTab==='done'?'完成流程回放后，场景记录会归档到这里。':'调整筛选条件，或点击“新建农事”添加任务。');}
  function renderTasks(full=false){
    return `<section id="task-panel" class="panel task-panel ${full?'wide-task-table':''}" aria-label="农事任务"><div class="panel-heading"><div class="heading-with-meta"><h2>${full?'农事任务':'本周农事'}</h2><span class="date-range">场景 9/13 - 9/19</span></div>${renderTaskTabs()}<button class="button primary" data-action="new-task">${icon('plus')}新建场景农事</button></div>${full?`<div class="content-toolbar"><div class="input-search">${icon('search')}<input id="task-search" value="${escapeHTML(state.taskSearch)}" placeholder="搜索地块、作物、负责人…" aria-label="搜索任务"></div><button class="button" data-action="export-tasks">${icon('export')}导出筛选结果</button></div>`:''}<div id="bulk-toolbar" class="bulk-toolbar ${state.selectedTasks.size?'':'hidden'}"><span>已选 <strong>${state.selectedTasks.size}</strong> 项</span><button class="button small-button soft" data-action="bulk-release">批量登记场景队列</button><button class="button small-button" data-action="export-selected">导出所选</button><span class="bulk-spacer"></span><button class="text-link" data-action="clear-selection">取消选择</button></div><div id="task-table-container">${taskTable()}</div><div class="table-bottom"><span>共 <strong>${filteredTasks().length}</strong> 项${state.taskTab==='pending'?'待核验任务':''} · 数据保存在当前浏览器</span><button data-action="${full?'export-tasks':'all-operations'}">${full?'导出当前结果':'查看全部作业 →'}</button></div></section>`;
  }
  function sparkline(points,color,id){return `<svg class="sparkline" viewBox="0 0 86 24" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="spark-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".11"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="M0 24L${points}L86 24Z" fill="url(#spark-${id})"/><polyline points="${points}" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;}
  function renderWeather(){
    const metrics=[['temp','thermometer','24.5°C','气温','#3caf79','0,14 8,10 15,11 23,7 31,10 39,6 47,9 55,5 63,9 72,6 80,10 86,8'],['wind','wind','2.1 m/s','风速','#4396ff','0,15 8,11 17,12 25,7 34,8 42,6 50,10 58,7 66,8 75,13 86,10'],['humidity','drop','23.8%','湿度','#3893ff','0,16 8,11 16,13 23,9 32,10 40,6 49,10 57,8 66,12 74,9 86,12'],['soil','soil','24.1°C','土温','#bd8b56','0,15 9,12 17,12 25,10 34,11 42,8 50,9 58,12 67,13 76,10 86,12']];
    const forecast=[['今天','sun','晴','24° / 14°'],['明天','cloud','多云','22° / 13°'],['周二','rain','小雨','20° / 12°'],['周三','cloud','多云','21° / 13°'],['周四','sun','晴','23° / 15°']];
    return `<section class="panel weather-panel"><div class="panel-heading"><div class="heading-with-meta"><h2>实时农情</h2><span class="demo-tag">场景</span></div><button class="text-link" data-route="conditions">查看更多${icon('chevron')}</button></div><div class="weather-readings">${metrics.map(([name,ic,value,label,color,points])=>`<div class="weather-metric ${name}">${icon(ic)}<strong class="num">${value}</strong><small>${label}</small>${sparkline(points,color,name)}</div>`).join('')}</div><div class="weather-forecast">${forecast.map(([day,type,condition,temp])=>`<div class="forecast-day"><span class="day-label">${day}</span>${weatherIcon(type)}<span class="day-condition">${condition}</span><span class="day-temperatures num">${temp}</span></div>`).join('')}</div><div class="weather-source"><span>北区气象站 · 09/13 10:30</span><span>场景气象，非实时预报</span></div></section>`;
  }
  function renderEquipmentSummary(){return `<section class="panel equipment-panel"><div class="panel-heading"><h2>设备状态</h2><button class="text-link" data-route="equipment">查看全部${icon('chevron')}</button></div><div class="equipment-grid">${Object.entries(DEVICE_TYPES).map(([type,d])=>`<button class="equipment-tile" data-action="equipment-type" data-type="${type}" title="查看 ${d.name}"><div class="equipment-top">${icon(d.icon)}<strong class="num">${d.count}</strong></div><div class="equipment-name"><span class="status-dot" ${type==='monitor'?'style="background:#99a3ae"':''}></span>${d.name}</div></button>`).join('')}</div></section>`;}
  function trendData(){
    const len=state.trendDays,c=taskCounts();return Array.from({length:len},(_,i)=>{const date=new Date(`${DEMO_DATE}T12:00:00`);date.setDate(date.getDate()-(len-1-i));const stamp=`${date.getMonth()+1}/${date.getDate()}`;if(i===len-1)return {date:stamp,pending:c.pending,running:c.running,done:c.done};return {date:stamp,pending:[3,6,3,7,4,6,4][i%7],running:[1,0,0,1,2,0,1][i%7],done:[4,4,4,2,3,4,5][i%7]};});
  }
  function chartSVG(){
    const data=trendData(),w=400,h=186,left=30,right=11,top=14,bottom=30,plotW=w-left-right,plotH=h-top-bottom;
    const max=Math.max(15,Math.ceil(Math.max(...data.map(d=>d.pending+d.running+d.done))/5)*5);const slot=plotW/data.length,bar=Math.min(27,slot*.56);
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="最近${state.trendDays}天任务状态数量趋势，历史数据为场景"><desc>展示场景队列、流程回放、场景归档任务；最后一天随当前场景任务同步更新。</desc>${Array.from({length:4},(_,i)=>{const v=max/3*i,y=top+plotH-plotH*i/3;return `<line class="chart-grid" x1="${left}" x2="${w-right}" y1="${y}" y2="${y}"/><text class="chart-tick" text-anchor="end" x="${left-10}" y="${y+3}">${Math.round(v)}</text>`;}).join('')}${data.map((d,i)=>{const x=left+i*slot+(slot-bar)/2;let cumulative=0;const parts=[['pending','#f6a12b'],['running','#3f97ed'],['done','#44ae80']].map(([key,color])=>{const ht=d[key]/max*plotH;const y=top+plotH-(cumulative+d[key])/max*plotH;cumulative+=d[key];return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bar.toFixed(2)}" height="${ht.toFixed(2)}" fill="${color}" ${key==='done'?'rx="2"':''}/>`;}).join('');return `<g class="chart-group" data-chart-index="${i}" tabindex="0" aria-label="${d.date}：场景队列${d.pending}项，流程回放${d.running}项，场景归档${d.done}项"><rect x="${(left+i*slot).toFixed(2)}" y="${top}" width="${slot.toFixed(2)}" height="${plotH}" fill="transparent"/>${parts}<title>${d.date} · 场景队列 ${d.pending} · 流程回放 ${d.running} · 场景归档 ${d.done}</title>${data.length===7||i%5===0||i===data.length-1?`<text class="chart-tick" text-anchor="middle" x="${(x+bar/2).toFixed(1)}" y="${h-11}">${d.date}</text>`:''}</g>`;}).join('')}</svg>`;
  }
  function renderTrend(large=false){return `<section class="panel trend-panel ${large?'report-chart':''}"><div class="panel-heading"><h2>${large?'农事任务状态趋势':'近期任务趋势'}</h2><select class="select-compact" data-trend-select aria-label="趋势时间范围"><option value="7" ${state.trendDays===7?'selected':''}>近7天</option><option value="30" ${state.trendDays===30?'selected':''}>近30天</option></select></div><div class="chart-legend">${[['pending','场景队列'],['running','流程回放'],['completed','场景归档']].map(([key,name])=>`<span class="legend-item"><i class="status-dot ${key}"></i>${name}</span>`).join('')}</div><div class="trend-chart">${chartSVG()}<div class="chart-tooltip hidden"></div></div>${large?'<div class="table-bottom"><span>历史日期为场景序列；9/13 为当前任务快照。</span><button data-action="export-trend">导出趋势数据</button></div>':''}</section>`;}
  function renderDashboard(){return `${renderOverview()}<div class="dashboard-grid"><div class="left-column">${renderMap()}${renderTasks()}</div><div class="right-column">${renderWeather()}${renderEquipmentSummary()}${renderTrend()}</div></div>`;}
  function renderFields(){

  function filteredDevices(){return DEVICES.filter(d=>(state.deviceType==='all'||d.type===state.deviceType)&&(state.deviceStatus==='all'||d.status===state.deviceStatus)&&(!state.deviceSearch||`${d.id} ${d.name} ${d.field} ${d.manager}`.toLowerCase().includes(state.deviceSearch.toLowerCase())));}
  function equipmentTable(){const devices=filteredDevices();return devices.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>设备名称 / 编号</th><th>设备类型</th><th>当前状态</th><th>所在区域</th><th>负责人</th><th>场景更新时间</th><th>操作</th></tr></thead><tbody>${devices.map(d=>`<tr><td><strong>${d.name}</strong><small>${d.id}</small></td><td>${DEVICE_TYPES[d.type].name}</td><td><span class="tag ${DEVICE_STATUS[d.status].color}">${DEVICE_STATUS[d.status].name}</span></td><td>${d.field} · ${parcelById(d.field).name}</td><td>${d.manager}</td><td>${d.last}</td><td><button class="button small-button" data-action="device-detail" data-id="${d.id}">查看详情</button></td></tr>`).join('')}</tbody></table></div><div class="table-bottom"><span>共 ${devices.length} 台设备 · 当前为本地场景设备档案</span><button data-action="export-equipment">导出设备列表</button></div>`:emptyState('没有找到匹配的设备','请尝试其他名称、编号或筛选条件。','monitor');}
  function renderEquipment(){return `${pageHead('equipment','设备档案、场景状态与场景位置统一查看；本场景不提供真实设备控制。',`<button class="button" data-action="export-equipment">${icon('export')}导出设备</button>`)}<div class="summary-grid">${Object.values(DEVICE_TYPES).map(d=>summaryCard(d.name,d.count,'台',d.icon)).join('')}</div><section class="panel"><div class="content-toolbar"><div class="filter-pills">${[['all','全部设备'],...Object.entries(DEVICE_TYPES).map(([key,d])=>[key,d.name])].map(([key,name])=>`<button class="filter-pill ${state.deviceType===key?'active':''}" data-action="device-filter" data-filter="${key}">${name}</button>`).join('')}</div><select class="select-compact" id="device-status-filter" aria-label="设备状态筛选"><option value="all">全部状态</option>${Object.entries(DEVICE_STATUS).map(([key,d])=>`<option value="${key}" ${state.deviceStatus===key?'selected':''}>${d.name}</option>`).join('')}</select></div><div class="content-toolbar"><div class="input-search">${icon('search')}<input id="device-search" value="${escapeHTML(state.deviceSearch)}" placeholder="搜索设备、编号、地块…" aria-label="搜索设备"></div><span class="small muted">场景：4 台离线 · 1 台维护中</span></div><div id="equipment-table-container">${equipmentTable()}</div></section>`;}
  function renderOperations(){const c=taskCounts();return `${pageHead('operations','以任务为中心，串联地块、人员与资源，回放农事流程并记录场景状态。')}<div class="summary-grid">${summaryCard('全部任务',c.total,'项','clipboard')}${summaryCard('待安排面积',c.pendingArea,'亩','clock')}${summaryCard('流程回放面积',c.runningArea,'亩','tractor')}${summaryCard('场景归档面积',c.doneArea,'亩','checkCircle')}</div>${renderTasks(true)}`;}
  function renderSupplies(){const list=SUPPLIES.filter(s=>state.supplyFilter==='all'||s.stock<s.safe);return `${pageHead('supplies','农资库存与安全库存阈值场景；所有数量仅用于界面展示。',`<button class="button" data-action="export-supplies">${icon('export')}导出库存</button>`)}<div class="summary-grid">${summaryCard('物资品类',SUPPLIES.length,'类','basket')}${summaryCard('低库存预警',SUPPLIES.filter(s=>s.stock<s.safe).length,'项','alert')}${summaryCard('存储场所',new Set(SUPPLIES.map(s=>s.store)).size,'处','warehouse')}${summaryCard('本期记录',SUPPLIES.length,'条','clipboard')}</div><section class="panel"><div class="content-toolbar"><div class="filter-pills"><button class="filter-pill ${state.supplyFilter==='all'?'active':''}" data-action="supply-filter" data-filter="all">全部农资</button><button class="filter-pill ${state.supplyFilter==='low'?'active':''}" data-action="supply-filter" data-filter="low">低库存预警 · 2</button></div><span class="demo-tag">场景库存</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>物资名称 / 规格</th><th>类别</th><th>当前库存</th><th>安全库存</th><th>库存状态</th><th>存放地点</th><th>更新日期</th></tr></thead><tbody>${list.map(s=>`<tr><td><strong>${s.name}</strong><small>${s.spec}</small></td><td>${s.category}</td><td><strong class="num">${fmt(s.stock)} ${s.unit}</strong></td><td>${fmt(s.safe)} ${s.unit}</td><td><span class="tag ${s.stock<s.safe?'orange':'green'}">${s.stock<s.safe?'建议补充':'库存充足'}</span></td><td>${s.store}</td><td>${s.updated}</td></tr>`).join('')}</tbody></table></div></section>`;}
  function conditionHistoryChart(){return `<svg viewBox="0 0 560 205" role="img" aria-label="北区气象站的场景24小时温湿度变化"><defs><linearGradient id="envGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38a77b" stop-opacity=".15"/><stop offset="100%" stop-color="#38a77b" stop-opacity="0"/></linearGradient></defs>${[25,65,105,145].map((y,i)=>`<line x1="36" x2="545" y1="${y}" y2="${y}" stroke="#eef3ef"/><text x="23" y="${y+4}" font-size="10" fill="#98a99c" text-anchor="end">${30-i*5}</text>`).join('')}<path d="M36 145 78 138 120 139 162 146 204 135 246 112 288 88 330 65 372 48 414 58 456 81 498 100 540 116 L540 165H36Z" fill="url(#envGradient)"/><polyline points="36,145 78,138 120,139 162,146 204,135 246,112 288,88 330,65 372,48 414,58 456,81 498,100 540,116" fill="none" stroke="#34a576" stroke-width="2.5" stroke-linejoin="round"/>${['00:00','04:00','08:00','12:00','16:00','20:00','24:00'].map((t,i)=>`<text x="${36+i*84}" y="192" text-anchor="middle" font-size="10" fill="#92a698">${t}</text>`).join('')}<text x="37" y="12" font-size="9" fill="#96a599">气温 °C · 9/12 历史场景</text></svg>`;}
  function renderConditions(){return `${pageHead('conditions','北区气象站 · 固定场景时间：2026-09-13 10:30。预报和农情数据未连接外部服务。',`<button class="button" data-action="export-environment">${icon('export')}导出观测场景</button>`)}<div class="notice-banner">${icon('info')}<span>当前气象、土壤读数与预报均为前端场景，不用于实际农事决策；生产环境需接入可信气象和传感器数据。</span></div><div class="monitor-layout"><section class="panel monitor-station"><div class="heading-with-meta"><h3>北区综合气象站</h3><span class="tag green">场景状态</span></div><p>STATION-001 · 北区一号田 · 棉花种植区</p><div class="monitor-large-readings">${[['thermometer','24.5°C','空气温度'],['wind','2.1 m/s','瞬时风速'],['drop','23.8%','空气湿度'],['soil','24.1°C','土壤温度']].map(([ic,v,l])=>`<div>${icon(ic)}<strong class="num">${v}</strong><span>${l}</span></div>`).join('')}</div><div class="drawer-section"><h3>24 小时气温变化</h3><div class="history-chart" style="padding:0">${conditionHistoryChart()}</div></div></section>${renderWeather()}</div><h3 class="section-label">地块墒情监测</h3><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>监测地块</th><th>作物 / 阶段</th><th>场景土壤含水率</th><th>监测标记</th><th>负责人</th><th>查看</th></tr></thead><tbody>${PARCELS.map(f=>`<tr><td><strong>${f.id} · ${f.name}</strong></td><td>${f.crop} / ${f.stage}</td><td class="num">${f.moisture}%</td><td><span class="tag ${f.status==='abnormal'?'orange':'green'}">${f.status==='abnormal'?'待现场复核':'常规巡检'}</span></td><td>${f.manager}</td><td><button class="button small-button" data-action="field-detail" data-field="${f.id}">地块详情</button></td></tr>`).join('')}</tbody></table></div></section>`;}

  function renderData(){const sets=[['fields','map','地块基础档案','地块编号、作物、面积、管理人员与示意边界。',PARCELS.length],['tasks','clipboard','农事任务记录','计划、状态、优先级、资源与任务备注。',state.tasks.length],['equipment','monitor','设备基础档案','拖拉机、无人机、灌溉与监控设备场景记录。',DEVICES.length],['supplies','basket','农资库存台账','物资名称、库存数量、安全阈值与仓储地点。',SUPPLIES.length],['storage','warehouse','收获入库批次','场景收获批次、作物、重量与质检信息。',STORAGE_LOTS.length],['environment','drop','环境观测场景','气温、风速、湿度与各地块墒情。',PARCELS.length]];return `${pageHead('data','本地场景数据集 · 可预览并导出 JSON，便于后续对接接口。',`<button class="button primary" data-action="export-backup">${icon('export')}导出全部场景数据</button>`)}<div class="notice-banner">${icon('database')}<span>数据存储：${persistent?'当前浏览器 localStorage':'当前页面内存'}。不同浏览器、不同域名以及 file:// 与 localhost 之间的数据不自动同步。本页面未连接数据库或云服务。</span></div><div class="page-grid">${sets.map(([key,ic,title,desc,count])=>`<article class="panel dataset-card"><div class="summary-icon">${icon(ic)}</div><h3>${title}</h3><p>${desc}</p><div class="dataset-card-footer"><span>${count} 条记录</span><button class="button small-button" data-action="preview-dataset" data-dataset="${key}">${icon('eye')}预览数据</button></div></article>`).join('')}</div>`;}
  function renderSettings(){return `${pageHead('settings','基础信息和通知偏好仅保存在当前浏览器。')}<div class="settings-layout"><section class="panel settings-panel"><h3>农场基本信息</h3><form id="settings-form"><div class="form-grid"><div class="form-field full"><label for="setting-farm">农场名称<i>*</i></label><input id="setting-farm" name="farmName" required maxlength="20" value="${escapeHTML(state.settings.farmName)}"></div><div class="form-field full"><label for="setting-location">农场所在区域<i>*</i></label><input id="setting-location" name="location" required maxlength="50" value="${escapeHTML(state.settings.location)}"></div><div class="form-field full"><label for="setting-manager">管理员称呼<i>*</i></label><input id="setting-manager" name="manager" required maxlength="20" value="${escapeHTML(state.settings.manager)}"></div></div><h3 style="margin:27px 0 0">通知偏好</h3><label class="setting-row"><div><strong>农事任务提醒</strong><span>在站内通知中显示待安排农事</span></div><input class="switch" name="taskReminders" type="checkbox" ${state.settings.taskReminders?'checked':''}></label><label class="setting-row"><div><strong>设备异常提醒</strong><span>在站内通知中显示设备离线消息</span></div><input class="switch" name="equipmentAlerts" type="checkbox" ${state.settings.equipmentAlerts?'checked':''}></label><div class="settings-save"><button type="submit" class="button primary">${icon('check')}保存设置</button></div></form></section><section class="panel settings-panel"><h3>关于此场景</h3><p>一个不依赖前端框架、外部地图服务或在线图标库的农场管理界面。任务流转和基础信息变更在本地完成。</p><div class="settings-footnote">场景业务日期：2026-09-13<br>存储方式：${persistent?'localStorage（浏览器本地）':'内存模式（当前页面）'}<br>地图来源：用户参考图裁切底图<br>地图边界：交互示意，非测绘数据<br>外部网络请求：无<br>实际设备控制：无</div><h3 style="margin:27px 0 12px">场景数据管理</h3><p>导出 JSON 可用于后续开发参考。重置会覆盖你在本浏览器中创建或修改的场景任务、设置与通知状态。</p><div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:18px"><button class="button" data-action="export-backup">${icon('export')}导出数据</button><button class="button danger" data-action="reset-demo">${icon('refresh')}重置场景</button></div></section><   const renderers={dashboard:renderDashboard,fields:renderFields,equipment:renderEquipment,operations:renderOperations,supplies:renderSupplies,conditions:renderConditions,storage:renderStorage,reports:renderReports,data:renderData,settings:renderSettings};

  // ---- 地图：本地底图 + 可交互 SVG 地块；所有地理信息均为示意 ----
  function updateMapTransform(){
    const world=$('#map-world');if(world)world.setAttribute('transform',`translate(${500+state.mapPan.x} ${212.5+state.mapPan.y}) scale(${state.mapZoom}) translate(-500 -212.5)`);
  }
  function fieldMatches(f){
    const query=state.mapSearch.toLowerCase().trim();
    const taskNames=state.tasks.filter(t=>t.field===f.id).map(t=>`${t.type} ${t.manager}`).join(' ');
    return (state.mapFilter==='all'||fieldStatus(f)===state.mapFilter)&&(!query||`${f.id} ${f.name} ${f.crop} ${taskNames}`.toLowerCase().includes(query));
  }
  function updateMap(){
    if(!$('#farm-map'))return;
    $$('.parcel-shape').forEach(el=>{const f=parcelById(el.dataset.field),status=fieldStatus(f),match=fieldMatches(f);el.style.opacity=match?'1':'.13';el.setAttribute('fill',FIELD_STATUSES[status].color);el.setAttribute('stroke',state.mapMode==='satellite'?'#dce6c5':FIELD_STATUSES[status].color);el.setAttribute('fill-opacity',state.mapLayers.status?(state.mapMode==='satellite'?'.07':'.25'):'0');el.classList.toggle('selected',state.selectedField===f.id);el.setAttribute('aria-label',`${f.id} ${f.name} ${f.crop} ${f.area}亩，${FIELD_STATUSES[status].name}`);});
    $$('.parcel-label').forEach(el=>{const f=parcelById(el.dataset.labelField);el.style.opacity=fieldMatches(f)?'1':'.12';$('rect',el).setAttribute('fill',state.mapMode==='satellite'?'#294c40e8':FIELD_STATUSES[fieldStatus(f)].color);});
    $('#parcel-labels').classList.toggle('hidden',!state.mapLayers.labels);
    $('#map-devices').classList.toggle('hidden',!state.mapLayers.devices);
    $$('.map-filter-item').forEach(el=>{el.classList.toggle('active',el.dataset.filter===state.mapFilter);el.setAttribute('aria-pressed',String(el.dataset.filter===state.mapFilter));});
    updateMapTransform();
  }
  function mapPoint(event){const world=$('#map-world');if(!world)return null;const matrix=world.getScreenCTM();return matrix?new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse()):null;}
  function drawMeasurement(){
    const geom=$('#measure-geometry'),note=$('#map-measure-note');if(!geom)return;
    const points=state.measurePoints;
    geom.innerHTML=points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#fff" stroke="#17694a" stroke-width="2"/>`).join('');
    if(points.length===2){
      const [a,b]=points,dist=Math.hypot(b.x-a.x,b.y-a.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      geom.innerHTML=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="white" stroke-width="3" stroke-dasharray="6 4"/>${geom.innerHTML}<rect x="${mid.x-45}" y="${mid.y-30}" width="90" height="22" rx="6" fill="#174e3b"/><text x="${mid.x}" y="${mid.y-15}" fill="#fff" text-anchor="middle" font-size="10">${dist.toFixed(1)} 绘图单位</text>`;
      note.textContent='示意距离，非实际测绘；再次点选可重新测量';
    }else if(note)note.textContent=points.length?'继续点选第二个位置':'在地图上点选两点，计算示意距离';
  }
  function setupMap(){
    const svg=$('#farm-map');if(!svg)return;updateMap();drawMeasurement();
    let drag=null;
    svg.addEventListener('pointerdown',event=>{if(event.button!==0||state.measureMode)return;drag={x:event.clientX,y:event.clientY,pan:{...state.mapPan},moved:false};});
    svg.addEventListener('pointermove',event=>{
      if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
      if(Math.hypot(dx,dy)>5){drag.moved=true;try{svg.setPointerCapture(event.pointerId);}catch{}}
      if(drag.moved){const m=svg.getScreenCTM(),scale=m?.a||1;state.mapPan.x=Math.max(-550,Math.min(550,drag.pan.x+dx/scale));state.mapPan.y=Math.max(-260,Math.min(260,drag.pan.y+dy/scale));updateMapTransform();}
    });
    const endDrag=event=>{if(drag?.moved){suppressMapClick=true;setTimeout(()=>suppressMapClick=false,150);}drag=null;try{if(svg.hasPointerCapture(event.pointerId))svg.releasePointerCapture(event.pointerId);}catch{}};
    svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
    svg.addEventListener('pointerleave',()=>{if(drag&&!drag.moved)drag=null;});
    svg.addEventListener('click',event=>{
      if(suppressMapClick){event.stopPropagation();return;}
      if(state.measureMode){event.stopPropagation();const p=mapPoint(event);if(!p)return;if(state.measurePoints.length===2)state.measurePoints=[];state.measurePoints.push({x:+p.x.toFixed(2),y:+p.y.toFixed(2)});drawMeasurement();}
    });
    svg.addEventListener('wheel',event=>{if(!event.ctrlKey)return;event.preventDefault();state.mapZoom=Math.max(.7,Math.min(2.8,state.mapZoom+(event.deltaY<0?.1:-.1)));updateMapTransform();},{passive:false});
  }
  function showMapSearchResults(){

  function setupCharts(){

  // ---- 无障碍弹层、抽屉、提示 ----
  function toast(message,type='success'){

  function newTaskId(){return `TSK-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;}
  function openTaskForm({id=null,field=null,copy=false}={}){

    const initial=existing?clone(existing):{field:field||'A-01',type:'巡田',area:parcelById(field||'A-01').area,date:DEMO_DATE,start:'09:00',end:'11:00',manager:parcelById(field||'A-01').manager,priority:'normal',resources:[],notes:'',status:'draft'};

n>`).join('')}</select></div><div class="form-field"><label for="task-status">保存状态</label>${['running','done'].includes(initial.status)?`<input value="${TASK_STATUSES[initial.status].name}" readonly><input type="hidden" name="status" value="${initial.status}">`:`<select id="task-status" name="status"><option value="draft" ${initial.status==='draft'?'selected':''}>待人工确认 · 保存草稿</option><option value="ready" ${initial.status==='ready'?'selected':''}>场景队列 · 不下发设备</option></select>`}</div><div class="form-field full"><label for="task-resources">计划资源</label><input id="task-resources" name="resources" maxlength="250" value="${escapeHTML(initial.resources.join(', '))}" placeholder="例：TRACTOR-001, UAV-001（逗号分隔）"><small>仅记录资源编号；不会调用或控制真实设备。</small></div><div class="form-field full"><label for="task-notes">任务说明</label><textarea id="task-notes" name="notes" maxlength="500" placeholder="补充作业安排、现场要求等">${escapeHTML(initial.notes||'')}</textarea></div></div><div class="form-note">场景日期固定为 2026/09/13–09/19。新任务将同步更新统计卡片、农事列表和地图状态；可在设置中恢复初始数据。</div></form>`;
    openOverlay(modalShell(editing?'编辑农事':copy?'复制农事':'新建农事','明确地块、时间和责任人，让每一次作业有迹可循。',html,`<span class="footer-note">${icon('shield','sm')} &nbsp;仅保存到本地浏览器</span><button class="button" data-action="close-overlay">取消</button><button type="submit" form="task-form" class="button primary">${icon('check')}${editing?'保存修改':'创建农事'}</button>`));

  function saveTaskForm(form){
    if(!form.reportValidity())return;
    const values=Object.fromEntries(new FormData(form)),f=parcelById(values.field),errorBox=$('#task-form-error');
    const error=message=>{errorBox.textContent=message;errorBox.classList.remove('hidden');errorBox.scrollIntoView({block:'nearest'});};
    if(!f||!TASK_STATUSES[values.status]||!PRIORITIES[values.priority])return error('任务字段不合法，请重新选择。');
    if(!Number.isFinite(+values.area)||+values.area<=0||+values.area>f.area)return error(`计划面积必须大于 0，且不超过地块面积 ${f.area} 亩。`);
    if(values.start>=values.end)return error('结束时间必须晚于开始时间；本场景不支持跨日任务。');
    if(values.date<'2026-09-13'||values.date>'2026-09-19')return error('请选择场景周内的日期：2026/09/13–09/19。');
    if(!values.manager.trim())return error('请填写负责人。');
    const id=form.dataset.editId,existing=id?taskById(id):null;
    if(id&&!existing)return error('任务已不存在，请关闭并重新操作。');
    const resources=[...new Set(values.resources.split(/[,，\n]+/).map(s=>s.trim().toUpperCase()).filter(Boolean))].slice(0,12);
    const conflicts=state.tasks.filter(t=>t.id!==id&&t.status!=='done'&&t.date===values.date&&t.start<values.end&&values.start<t.end&&t.resources.some(r=>resources.includes(r)));
    const record={...(existing||{}),id:id||newTaskId(),field:f.id,type:String(values.type).slice(0,20),area:+values.area,date:values.date,start:values.start,end:values.end,manager:values.manager.trim(),priority:values.priority,status:existing&&['running','done'].includes(existing.status)?existing.status:values.status,resources,notes:values.notes.trim(),risk:conflicts.length?'资源时段重叠 · 待复核':'按计划安排 · 现场复核',createdAt:existing?.createdAt||DEMO_DATE,updatedAt:new Date().toISOString()};
    if(existing)state.tasks=state.tasks.map(t=>t.id===id?record:t);else state.tasks.push(record);
    closeOverlay();state.taskTab=TASK_STATUSES[record.status].group;refreshAfterTaskChange(existing?'农事修改已保存':'新农事已创建，统计与地图已更新');
    if(conflicts.length)setTimeout(()=>toast(`发现 ${conflicts.length} 项资源时段重叠，已标记为待复核。`,'warning'),400);
  }
  function transitionTask(id,to){
    const t=taskById(id);if(!t)return;
    const flows={ready:{from:'draft',title:'登记场景队列',label:'确认登记',message:`将 <strong>${t.field} · ${escapeHTML(t.type)}</strong> 从待人工确认移入场景队列，不生成设备命令。`,toast:'已登记场景队列，等待补证与人工核验'},running:{from:'ready',title:'启动流程回放',label:'开始回放',message:`仅将 <strong>${t.field} · ${escapeHTML(t.type)}</strong> 标记为流程回放，场景面积 <strong>${fmt(t.area)} 亩</strong>；不代表现场开机。`,toast:'流程回放已开始；未触发真实作业'},done:{from:'running',title:'归档回放场景',label:'归档场景',message:`将 <strong>${t.field} · ${escapeHTML(t.type)}</strong> 标记为场景归档。本地场景面积 <strong>${fmt(t.area)} 亩</strong> 不是实际作业量。`,toast:'回放场景已归档；不是实际验收凭证'}};
    const flow=flows[to];if(!flow||t.status!==flow.from)return toast('任务状态已经变化，请刷新列表后重试。','warning');
    confirmDialog(flow.title,`${flow.message}<p style="font-size:11px;color:#95a398;margin-top:14px">仅变更本地任务状态，不向真实设备发送指令，不生成实际验收或入库凭证。</p>`,flow.label,()=>{const task=taskById(id);if(!task||task.status!==flow.from)return toast('状态不匹配，未执行变更。','warning');task.status=to;task.updatedAt=new Date().toISOString();if(to==='done')task.completedAt=new Date().toISOString();refreshAfterTaskChange(flow.toast);});
  }
  function deleteTask(id){const t=taskById(id);if(!t)return;confirmDialog('删除农事任务',`确定删除 <strong>${t.field} · ${escapeHTML(t.type)}</strong> 吗？此操作将删除当前浏览器中的该条场景记录。`,'确认删除',()=>{state.tasks=state.tasks.filter(t=>t.id!==id);refreshAfterTaskChange('任务已删除');},true);}
  function bulkRelease(){
    const selected=state.tasks.filter(t=>state.selectedTasks.has(t.id)),drafts=selected.filter(t=>t.status==='draft');
    if(!drafts.length)return toast('所选任务中没有待登记的场景计划。','warning');
    confirmDialog('批量登记场景队列',`本次仅在浏览器登记 <strong>${drafts.length}</strong> 项场景计划，不生成或发送设备命令。其余 <strong>${selected.length-drafts.length}</strong> 项状态不匹配的任务不会变更。`,'确认登记',()=>{drafts.forEach(t=>{t.status='ready';t.updatedAt=new Date().toISOString();});refreshAfterTaskChange(`已登记 ${drafts.length} 项场景任务；未下发真实设备`);});
  }

  // ---- 数据导出：UTF-8 BOM CSV，防止电子表格公式注入 ----
  function downloadFile(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
  function csvCell(value){let s=String(value??'');if(typeof value==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
  function exportCSV(name,headers,rows){downloadFile(`${name}_20260913.csv`,'\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV 已生成，请查看浏览器下载记录');}

  function getDataset(key){const datasets={fields:PARCELS.map(f=>({...f,status:fieldStatus(f)})),tasks:state.tasks,equipment:DEVICES,supplies:SUPPLIES,storage:STORAGE_LOTS,environment:PARCELS.map(f=>({field:f.id,timestamp:'2026-09-13T10:30:00+08:00',airTemperature:24.5,windSpeed:2.1,airHumidity:23.8,soilTemperature:24.1,soilMoisture:f.moisture,source:'场景数据',isLive:false}))};return datasets[key]||[];}

  // ---- 统一事件代理：页面可在离线 file:// 模式工作 ----
  document.addEventListener('click',event=>{
    const target=event.target instanceof Element?event.target:null;if(!target)return;
    if(target.matches('[data-backdrop]'))return closeOverlay();
    const nav=target.closest('[data-route]');if(nav){navigate(nav.dataset.route);return;}
    const parcel=target.closest('.parcel-shape');if(parcel&&!state.measureMode&&!suppressMapClick){openFieldDetail(parcel.dataset.field);return;}
    const button=target.closest('[data-action]');
    if(!button){if(!target.closest('#popover-root'))closePopover();if(!target.closest('.map-search'))$('#map-search-results')?.classList.add('hidden');if(document.body.classList.contains('mobile-nav-open')&&!target.closest('.sidebar'))document.body.classList.remove('mobile-nav-open');return;}
    const {action,id,field,tab,type,filter,dataset}=button.dataset;
    if(!['notifications','profile','task-more'].includes(action)&&!button.closest('#popover-root'))closePopover();
    switch(action){
      case 'toggle-sidebar':state.collapsed=!state.collapsed;document.body.classList.toggle('sidebar-collapsed',state.collapsed);break;
      case 'mobile-menu':document.body.classList.toggle('mobile-nav-open');break;
      case 'notifications':showNotifications(button);break;
      case 'read-notifications':state.notificationsRead=true;saveState();closePopover();renderTopbar();toast('所有通知已标记为已读');break;
      case 'profile':popoverAt(button,`<button data-route="settings">${icon('settings','sm')}农场基础设置</button><button data-route="data">${icon('database','sm')}本地数据中心</button><div class="divider"></div><button data-action="export-backup">${icon('export','sm')}导出场景数据</button><button class="danger" data-action="reset-demo">${icon('refresh','sm')}恢复初始场景</button>`);break;
      case 'task-tab':applyTaskTab(tab);break;
      case 'new-task':openTaskForm({field:field||null});break;
      case 'edit-task':openTaskForm({id});break;
      case 'copy-task':openTaskForm({id,copy:true});break;
      case 'view-task':openTaskDetail(id);break;
      case 'delete-task':deleteTask(id);break;
      case 'release':transitionTask(id,'ready');break;
      case 'start':transitionTask(id,'running');break;
      case 'complete':transitionTask(id,'done');break;
      case 'task-more':popoverAt(button,`<button data-action="view-task" data-id="${escapeHTML(id)}">${icon('eye','sm')}查看任务详情</button><button data-action="edit-task" data-id="${escapeHTML(id)}">${icon('edit','sm')}编辑任务</button><button data-action="copy-task" data-id="${escapeHTML(id)}">${icon('copy','sm')}复制为新计划</button><div class="divider"></div><button class="danger" data-action="delete-task" data-id="${escapeHTML(id)}">${icon('trash','sm')}删除场景任务</button>`);break;
      case 'field-detail':openFieldDetail(field);break;
      case 'clear-selection':state.selectedTasks.clear();updateTaskSelection();break;
      case 'bulk-release':bulkRelease();break;
      case 'all-operations':navigate('operations');break;
      case 'export-tasks':exportTasks();break;
      case 'export-selected':exportTasks(true);break;
      case 'close-overlay':closeOverlay();break;
      case 'confirm-operation':{const callback=confirmCallback;closeOverlay();if(callback)callback();break;}
      case 'map-mode':state.mapMode=button.dataset.mode;$$('[data-action="map-mode"]').forEach(el=>{el.classList.toggle('active',el.dataset.mode===state.mapMode);el.setAttribute('aria-pressed',String(el.dataset.mode===state.mapMode));});$('#map-canvas').classList.toggle('satellite-mode',state.mapMode==='satellite');updateMap();break;
      case 'map-filter':state.mapFilter=filter;updateMap();break;
      case 'map-layers':state.showLayers=!state.showLayers;$('#map-layer-menu').classList.toggle('hidden',!state.showLayers);button.classList.toggle('active',state.showLayers);button.setAttribute('aria-expanded',String(state.showLayers));break;
      case 'map-measure':state.measureMode=!state.measureMode;state.measurePoints=[];$('#map-canvas').classList.toggle('measure-mode',state.measureMode);$('#map-measure-note').classList.toggle('hidden',!state.measureMode);button.classList.toggle('active',state.measureMode);button.setAttribute('aria-pressed',String(state.measureMode));drawMeasurement();break;
      case 'map-zoom':state.mapZoom=Math.max(.7,Math.min(2.8,state.mapZoom+Number(button.dataset.step)));updateMapTransform();break;
      case 'map-reset':state.mapZoom=1;state.mapPan={x:0,y:0};state.selectedField=null;state.mapFilter='all';state.mapSearch='';state.measurePoints=[];$('#map-search').value='';$('#map-search-results').classList.add('hidden');updateMap();drawMeasurement();break;
      case 'map-fullscreen':state.mapExpanded=!state.mapExpanded;$('#map-canvas').classList.toggle('expanded',state.mapExpanded);document.body.style.overflow=state.mapExpanded?'hidden':'';break;
      case 'search-field':state.mapFilter='all';state.selectedField=field;$('#map-search-results').classList.add('hidden');updateMap();openFieldDetail(field);break;
      case 'equipment-type':state.deviceType=type;state.deviceStatus='all';state.deviceSearch='';navigate('equipment');break;
      case 'device-filter':state.deviceType=filter;renderMain();break;
      case 'device-detail':openDeviceDetail(id);break;
      case 'device-locate':closeOverlay();state.mapSearch='';state.mapFilter='all';state.selectedField=field;navigate('fields');state.selectedField=field;updateMap();openFieldDetail(field);break;
      case 'supply-filter':state.supplyFilter=filter;renderMain();break;
      case 'preview-dataset':previewDataset(dataset);break;
      case 'export-dataset':downloadFile(`farm_${dataset}_demo.json`,JSON.stringify(getDataset(dataset),null,2),'application/json;charset=utf-8');toast('数据集已导出为 JSON');break;
      case 'export-backup':exportBackup();break;
      case 'reset-demo':resetDemo();break;
      case 'export-fields':exportCSV('地块档案',['地块','名称','面积(亩)','作物','品种','状态','负责人'],PARCELS.map(f=>[f.id,f.name,f.area,f.crop,f.variety,FIELD_STATUSES[fieldStatus(f)].name,f.manager]));break;
      case 'export-equipment':exportCSV('设备档案',['设备编号','设备名称','类别','状态','地块','负责人'],filteredDevices().map(d=>[d.id,d.name,DEVICE_TYPES[d.type].name,DEVICE_STATUS[d.status].name,d.field,d.manager]));break;
      case 'export-supplies':exportCSV('农资库存',['编号','名称','规格','类别','库存','单位','安全库存','仓储地点'],SUPPLIES.filter(s=>state.supplyFilter==='all'||s.stock<s.safe).map(s=>[s.id,s.name,s.spec,s.category,s.stock,s.unit,s.safe,s.store]));break;
      case 'export-storage':exportCSV('收获入库台账',['批次编号','作物','来源地块','仓库','重量(吨)','含水率(%)','状态','日期'],STORAGE_LOTS.map(l=>[l.id,l.crop,l.field,l.warehouse,l.weight,l.moisture,l.status,l.date]));break;
      case 'export-environment':exportCSV('环境观测场景',['地块','观测时间','气温(°C)','风速(m/s)','空气湿度(%)','土壤温度(°C)','土壤含水率(%)','来源'],getDataset('environment').map(e=>[e.field,e.timestamp,e.airTemperature,e.windSpeed,e.airHumidity,e.soilTemperature,e.soilMoisture,e.source]));break;
      case 'export-trend':exportCSV('任务趋势场景',['日期','场景队列','流程回放','场景归档'],trendData().map(d=>[d.date,d.pending,d.running,d.done]));break;
      case 'print-report':window.print();break;
      default:console.warn('未定义交互：',action);
    }
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.id==='map-search'){state.mapSearch=el.value;showMapSearchResults();}
    if(el.id==='task-search'){state.taskSearch=el.value;refreshTaskTable();}
    if(el.id==='device-search'){state.deviceSearch=el.value;$('#equipment-table-container').innerHTML=equipmentTable();}
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.matches('[data-layer]')){state.mapLayers[el.dataset.layer]=el.checked;updateMap();}
    if(el.matches('[data-trend-select]')){state.trendDays=el.value==='30'?30:7;refreshCharts();}
    if(el.matches('[data-task-check]')){if(el.checked)state.selectedTasks.add(el.dataset.taskCheck);else state.selectedTasks.delete(el.dataset.taskCheck);updateTaskSelection();}
    if(el.id==='select-all-tasks'){filteredTasks().forEach(t=>el.checked?state.selectedTasks.add(t.id):state.selectedTasks.delete(t.id));updateTaskSelection();}
    if(el.id==='device-status-filter'){state.deviceStatus=el.value;$('#equipment-table-container').innerHTML=equipmentTable();}
    if(el.id==='task-field'){const f=parcelById(el.value);if(!f)return;$('#task-crop').value=f.crop;$('#task-area').value=f.area;$('#task-area').max=f.area;$('#task-area-hint').textContent=`不超过地块面积 ${f.area} 亩`;$('#task-manager').value=f.manager;}
  });
  document.addEventListener('submit',event=>{if(event.target.id==='task-form'){event.preventDefault();saveTaskForm(event.target);}if(event.target.id==='settings-form'){event.preventDefault();saveSettings(event.target);}});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      if($('#overlay-root').firstElementChild){closeOverlay();return;}
      if($('#popover-root').firstElementChild){closePopover();return;}
      if(state.mapExpanded){state.mapExpanded=false;$('#map-canvas')?.classList.remove('expanded');document.body.style.overflow='';return;}
      if(state.measureMode){state.measureMode=false;state.measurePoints=[];$('#map-canvas')?.classList.remove('measure-mode');$('#map-measure-note')?.classList.add('hidden');$('[data-action="map-measure"]')?.classList.remove('active');drawMeasurement();}
      $('#map-search-results')?.classList.add('hidden');document.body.classList.remove('mobile-nav-open');
    }
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('.parcel-shape')){event.preventDefault();if(!state.measureMode)openFieldDetail(event.target.dataset.field);}
    if(event.key==='Tab'&&$('#overlay-root').firstElementChild){
      const focusables=$$('button:not(:disabled),input:not(:disabled):not([type="hidden"]),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]',$('#overlay-root')).filter(el=>el.getClientRects().length);
      const first=focusables[0],last=focusables[focusables.length-1];if(!first)return;
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
  });
  window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(renderers[route]&&route!==state.route)navigate(route);});
  window.addEventListener('resize',()=>closePopover());
  window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&!$('#overlay-root').firstElementChild){loadState();renderAll();}});

  loadState();
  const route=location.hash.slice(1);if(renderers[route]){state.route=route;if(route==='operations')state.taskTab='all';}
  renderAll();
})();

</script>
</body>
</html>
