# /etc/nginx/conf.d/farm.yijxj.com.conf
# 后端仅本机 127.0.0.1:8080；公网只经本站点 HTTPS。
# 证书路径按实际修改。

server {
    listen 80;
    listen [::]:80;
    server_name farm.yijxj.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farm.yijxj.com;

    # ssl_certificate     /etc/letsencrypt/live/farm.yijxj.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/farm.yijxj.com/privkey.pem;

    client_max_body_size 1m;

    # API（含 JSDMirror 跨域调用）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 可选：应急同源前端（日常用户走 JSDMirror）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
